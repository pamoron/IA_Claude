name: APK de Electro_Perico

# Compila la aplicación en los servidores de GitHub, que sí traen el SDK de
# Android, y publica el APK como artefacto descargable.
on:
  push:
  workflow_dispatch:

# Necesario para publicar la versión descargable con el APK.
permissions:
  contents: write

jobs:
  build:
    name: Pruebas y APK instalable
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos al wrapper
        run: chmod +x ./gradlew

      - name: Pruebas unitarias
        run: |
          set -o pipefail
          ./gradlew test --no-daemon --console=plain 2>&1 | tee build-tests.log || {
            echo "================ ERRORES DE COMPILACION ================"
            grep -E "^e: |^w: .*error" build-tests.log | head -40
            echo "================ PRUEBAS FALLIDAS ======================"
            grep -E "FAILED|expected:" build-tests.log | head -40
            echo "======================================================="
            exit 1
          }

      - name: Publicar el informe de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-de-pruebas
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Compilar el APK de lanzamiento
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee build-apk.log || {
            echo "================ ERRORES DE COMPILACION ================"
            grep -E "^e: " build-apk.log | head -40
            echo "======================================================="
            exit 1
          }

      - name: Renombrar el APK
        run: |
          mkdir -p apk
          # Nombre fijo: así cada compilación sustituye a la anterior en la
          # versión publicada en lugar de acumularse. El commit concreto va en
          # las notas de la versión.
          cp app/build/outputs/apk/release/app-release.apk apk/Electro_Perico.apk

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Electro_Perico-apk
          path: apk/*.apk
          if-no-files-found: error
          retention-days: 30

      # Además del artefacto (que exige iniciar sesión en GitHub), se publica
      # una versión con el APK adjunto, que sí tiene enlace de descarga directo.
      - name: Publicar la versión descargable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notas="APK instalable compilado automáticamente desde la rama de desarrollo.

          Commit: \`${GITHUB_SHA::7}\`

          Instálalo permitiendo *Instalar aplicaciones desconocidas*. Se sustituye en cada cambio."
          gh release create apk-ultima \
            --title "Electro_Perico · APK de prueba" \
            --notes "$notas" \
            --prerelease 2>/dev/null || gh release edit apk-ultima --notes "$notas"
          # Limpia los APK antiguos que quedaron de compilaciones anteriores.
          gh release view apk-ultima --json assets \
            --jq '.assets[].name | select(. != "Electro_Perico.apk")' \
            | while read -r viejo; do gh release delete-asset apk-ultima "$viejo" --yes || true; done
          gh release upload apk-ultima apk/Electro_Perico.apk --clobber
